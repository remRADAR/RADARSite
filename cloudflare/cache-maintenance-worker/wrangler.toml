name = "radarsite-cache-maintenance"
main = "src/index.ts"
compatibility_date = "2026-09-24"

[triggers]
crons = ["0 3 * * *"]

[vars]
RADARSITE_CACHE_REVALIDATION_URL = "https://radarsite.vercel.app/api/cache/maintenance"

# Set the secret before deployment:
# wrangler secret put RADARSITE_CACHE_MAINTENANCE_TOKEN
