name: Verify production editorial routes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-production-routes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify all live editorial routes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://radarcharts.net
    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Wait for production to serve the new deployment
        shell: bash
        run: |
          set -euo pipefail
          target="$BASE_URL/ontheradar/articles/styling-is-choosing-life-with-aye-lawa-feat-wyza"
          for attempt in {1..60}; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "$target" || true)
            echo "Attempt $attempt/60: $status"
            if [[ "$status" == "200" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Production did not become ready within 10 minutes" >&2
          exit 1

      - name: Verify all 371 live editorial routes
        run: node scripts/verify-live-editorial-routes.mjs
