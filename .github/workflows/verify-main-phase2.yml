name: Verify merged main (Phase 2 checks)

# Scoped verification of the consolidated main branch after merging PRs #37/#38.
# Runs the checks CI does not run: content-store contract, editorial feed
# contract, editorial-archives + CSP contract tests, and the Vinext build.
on:
  push:
    branches: [verify/main-phase2-2026-11-01]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-main-phase2
  cancel-in-progress: true

jobs:
  verify:
    name: Contract tests + Vinext build on main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cloudflare content-store contract test
        run: npm run cloudflare-content:contract-test

      - name: Editorial feed contract test
        run: npm run test:editorial-feed

      - name: CSP contract test
        run: npm run test:csp

      - name: Editorial archives contract test
        run: npm run test:editorial-archives

      - name: Cloudflare (Vinext) Workers build
        run: npm run build:vinext
