name: Resync lockfile
on: workflow_dispatch

permissions:
  contents: write

jobs:
  resync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Report
        run: |
          echo "react resolved:"
          node -e "console.log(require('./package-lock.json').packages['node_modules/react'].version)"
          echo "rsdw resolved:"
          node -e "console.log(require('./package-lock.json').packages['node_modules/react-server-dom-webpack'].version)"
          git diff --stat -- package-lock.json || true

      - name: Commit to branch
        run: |
          git config user.name "lockfile-resync"
          git config user.email "lockfile-resync@users.noreply.github.com"
          git checkout -B fix/lockfile-resync
          git add package-lock.json
          git commit -m "fix(deps): regenerate package-lock.json to resolve react 19.3.1 ERESOLVE" || echo "no changes"
          git push -f -u origin fix/lockfile-resync
