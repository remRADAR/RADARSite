name: Resync lockfile (branch)

# One-off helper for chore/ci-disk-guards-2026-11-24.
#
# package-lock.json is ~525 KB, which is too large to write through the
# GitHub contents API from the sandbox, and the sandbox has no git
# credentials. This regenerates the lockfile on this branch only, using the
# same `npm install --package-lock-only` as the existing sync-lockfile
# workflow, so `npm ci` accepts the typescript ^6.0.3 pin.
#
# Deleted once the lockfile has landed.
on:
  push:
    branches: [chore/ci-disk-guards-2026-11-24]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resync-lockfile-branch
  cancel-in-progress: false

jobs:
  resync:
    # Skip pushes made by this workflow itself, so it can never loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/ci-disk-guards-2026-11-24

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit if it changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already in sync - nothing to do."
            exit 0
          fi
          echo "lockfile was out of sync; committing the regenerated file."
          node -e "const l=require('./package-lock.json');console.log('typescript', l.packages['node_modules/typescript'].version)"
          git config user.name "lockfile-sync-bot"
          git config user.email "lockfile-sync-bot@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): resync package-lock.json for typescript ^6.0.3"
          git push origin HEAD:chore/ci-disk-guards-2026-11-24
