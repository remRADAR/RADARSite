name: Production availability check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-healthcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  healthcheck:
    name: Probe radarcharts.net
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BASE_URL: https://radarcharts.net
    steps:
      - name: Check out the monitoring script
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe production
        run: npm run site:healthcheck
