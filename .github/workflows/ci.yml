name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          set +e
          npm run lint > lint.log 2>&1
          code=$?
          printf '### Lint output (tail)\n\n```\n%s\n```\n' "$(tail -n 150 lint.log)" >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Typecheck
        run: npm run typecheck

      - name: SEO audit contract test
        run: npm run test:seo-audit

      - name: Build (database skipped)
        run: npm run build
        env:
          RADAR_SKIP_DATABASE: "1"
