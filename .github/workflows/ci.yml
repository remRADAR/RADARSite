name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs on the same branch/PR are cancelled so a stale commit cannot
# hold a runner or report a misleading result. The newest commit always wins.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Hard ceiling: a hung install or build fails the job instead of burning
    # the runner for GitHub's 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Fail early and clearly when the runner is short on disk, rather than
      # dying mid-install with an opaque ENOSPC / exit 137. Reports only -
      # it never deletes anything.
      - name: Disk space preflight
        run: |
          MIN_GB=5
          AVAIL_KB=$(df --output=avail -k / | tail -1 | tr -d ' ')
          AVAIL_GB=$((AVAIL_KB / 1024 / 1024))
          echo "Available disk on /: ${AVAIL_GB} GB (minimum required: ${MIN_GB} GB)"
          df -h /
          if [ "$AVAIL_GB" -lt "$MIN_GB" ]; then
            echo "::error::Insufficient disk space: ${AVAIL_GB} GB available, ${MIN_GB} GB required. Free space on the runner and re-run. No cleanup was attempted."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Clean install from the lockfile. Fails loudly if package.json and
      # package-lock.json ever drift apart again (the react 19.3.1 ERESOLVE).
      - name: Install dependencies
        run: npm ci

      - name: Media reference contract test
        run: npx tsx scripts/media-reference-contract-test.ts

      - name: Editorial sanitizer idempotency contract test
        run: npm run test:editorial-sanitizer

      - name: RADARCharts Spotify sync contract test
        run: npm run radar-playlists:sync-contract-test

      - name: RADARMusic Spotify release-link contract test
        run: npm run release-links:spotify-scrape-contract-test

      - name: Artwork palette contract test
        run: npm run artwork-palette:contract-test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build (database skipped)
        run: npm run build
        env:
          RADAR_SKIP_DATABASE: "1"
