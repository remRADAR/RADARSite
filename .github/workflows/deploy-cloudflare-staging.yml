name: Deploy (Cloudflare production)

# Deploy the production Worker from the repository's source of truth. Manual dispatch
# remains available for rollback or re-deployment of a selected branch.
#
# Prerequisites (owner, one time):
#   1. Create a Cloudflare API token with Workers deploy permissions (see
#      docs/deployment-env-checklist-2026-11-03.md).
#   2. Add repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under
#      Settings -> Secrets and variables -> Actions.
#   3. Run this workflow from the Actions tab (branch that carries the workflow file,
#      or main after this branch is merged).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  # Never cancel a deploy mid-flight: a half-applied Worker upload is worse than
  # a queued one. Superseded runs wait, then deploy the newest commit.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Hard ceiling so a hung install or build fails instead of occupying the
    # runner for GitHub's 6-hour default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Fail early and clearly when the runner is short on disk, rather than
      # dying mid-install with an opaque ENOSPC / exit 137. Reports only -
      # it never deletes anything.
      - name: Disk space preflight
        run: |
          MIN_GB=5
          AVAIL_KB=$(df --output=avail -k / | tail -1 | tr -d ' ')
          AVAIL_GB=$((AVAIL_KB / 1024 / 1024))
          echo "Available disk on /: ${AVAIL_GB} GB (minimum required: ${MIN_GB} GB)"
          df -h /
          if [ "$AVAIL_GB" -lt "$MIN_GB" ]; then
            echo "::error::Insufficient disk space: ${AVAIL_GB} GB available, ${MIN_GB} GB required. Free space on the runner and re-run. No cleanup was attempted."
            exit 1
          fi

      - name: Fail fast if Cloudflare secrets are missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repo secret CLOUDFLARE_API_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions, then re-run."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Repo secret CLOUDFLARE_ACCOUNT_ID is not set. Add it under Settings -> Secrets and variables -> Actions, then re-run."
            missing=1
          fi
          if [ "$missing" = "1" ]; then exit 1; fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate social-card derivatives
        # Builds the 1200x630 WebP per article that /api/social-card prefers over
        # the full-size source artwork. Without these the route falls back to
        # decoding multi-megapixel images in the Worker and cold renders 503
        # (Cloudflare 1102) -- so this step is REQUIRED, not best-effort.
        #
        # It used to be continue-on-error, which hid a crash that produced zero
        # files and shipped a Worker whose cards still 503'd. It now fails the
        # deploy and prints diagnostics instead of degrading silently.
        run: |
          set -euo pipefail
          node --version
          node -e "const s=require('sharp'); console.log('sharp', s.versions.vips)"
          npm run social-cards:generate
          count=$(ls public/social/cards/*.webp 2>/dev/null | wc -l)
          echo "generated $count derivatives"
          if [ "$count" -lt 1 ]; then
            echo "::error::No social-card derivatives were generated; refusing to deploy a Worker whose cards will 503."
            exit 1
          fi

      - name: Build (Vinext / Cloudflare Workers)
        run: npm run build:vinext

      - name: Deploy Worker (radarsite-staging / radarcharts.net)
        run: npm run deploy:vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
