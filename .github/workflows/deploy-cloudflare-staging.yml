name: Deploy (Cloudflare staging)

# Manual dispatch ONLY: deploying the Worker is a consequential action and stays under
# explicit owner control. There is intentionally no push/schedule trigger.
#
# Prerequisites (owner, one time):
#   1. Create a Cloudflare API token with Workers deploy permissions (see
#      docs/deployment-env-checklist-2026-11-03.md).
#   2. Add repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under
#      Settings -> Secrets and variables -> Actions.
#   3. Run this workflow from the Actions tab (branch that carries the workflow file,
#      or main after this branch is merged).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail fast if Cloudflare secrets are missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repo secret CLOUDFLARE_API_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions, then re-run."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Repo secret CLOUDFLARE_ACCOUNT_ID is not set. Add it under Settings -> Secrets and variables -> Actions, then re-run."
            missing=1
          fi
          if [ "$missing" = "1" ]; then exit 1; fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Vinext / Cloudflare Workers)
        run: npm run build:vinext

      - name: Deploy Worker (radarsite-staging)
        # The staging Worker was previously reconciled through the Cloudflare
        # script API while fixing bindings. This explicit override lets the
        # repository configuration become authoritative again.
        run: npx cf deploy --prebuilt --no-strict
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
